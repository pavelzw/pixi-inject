[package]
name = "pixi-inject"
description = "Inject conda packages into an already existing conda prefix"
version = "0.1.3"
edition = "2024"

[features]
default = ["native-tls"]
native-tls = [
  "reqwest/native-tls",
  "rattler/native-tls",
  "rattler_networking/rustls",
  "rattler_package_streaming/rustls",
]
rustls-tls = [
  "reqwest/rustls",
  "rattler/rustls",
  "rattler_networking/rustls",
  "rattler_package_streaming/rustls",
]

[dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "default",
  "env-filter",
] }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "string"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
futures = "0.3.32"
indicatif = "0.18.4"
rattler = { version = "0.43.2", default-features = false }
rattler_digest = "1.3.0"
rattler_conda_types = "0.46.4"
rattler_index = "0.30.1"
rattler_lock = "0.30.3"
rattler_networking = { version = "0.27.2", default-features = false }
rattler_package_streaming = { version = "0.26.2", default-features = false }
rattler_shell = "0.27.2"
reqwest = { version = "0.13.3", default-features = false, features = ["http2"] }
tempfile = "3.27.0"

[dev-dependencies]
rstest = "0.26.1"
